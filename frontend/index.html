<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/yahora_favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- One stylesheet, both faces. The four spaces that used to sit after
         "css2?" turned the Bree Serif parameter into one named "    family",
         which Google silently drops — every heading, the brand name and every
         price on the site was falling back to Times. Inter now also downloads
         700 and 800, which the stylesheets ask for ~77 times and the browser
         was faking. Keep this on ONE line with no spaces inside the URL. -->
    <link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Yahora | Keep the Story Going</title>

    <!-- Default link-preview tags. Product pages have these REPLACED at the
         edge with per-product values (netlify/edge-functions/product-preview.js)
         — crawlers don't run JS, so they cannot be set from React. -->
    <meta
      name="description"
      content="Yahora is a student-only, university-verified marketplace. Buy and sell with verified students on your campus. Because Every Item Has a Memory."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yahora" />
    <meta property="og:title" content="Yahora | Keep the Story Going" />
    <meta
      property="og:description"
      content="A student-only, university-verified marketplace. Because Every Item Has a Memory."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
